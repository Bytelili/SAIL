release:
  scope: paper_core
  exact_experiment_recipe_included: false
  evaluation_code_included: false
  runnable_training_entrypoint_included: false
  runnable_evaluation_entrypoint_included: false

canonical_method_defaults:
  latent_dim: 256
  memory_dim: 256
  residual_rank: 256
  min_precision: 0.001
  max_precision: 100.0
  initial_precision: 0.05
  prior_precision: 1.0
  population_reference_mode: candidates
  probability_temperature: 1.0
  compatibility_temperature: 1.0
  precision_feature_mode: structured
  dimension_gate_mode: learned
  global_gate_mode: information
  residual_normalization: rms
  query_loss_weight: 1.0
  support_loss_weight: 0.1
  directional_loss_weight: 1.0
  kl_loss_weight: 0.0

model_interface:
  population_model: caller_provided
  population_candidates: precomputed_tensor_interface
  final_generation: direct_autoregressive
  final_reranking: false

privacy:
  datasets_included: false
  checkpoints_included: false
  machine_paths_included: false
  unpublished_candidate_heuristics_included: false
