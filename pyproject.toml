[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sail-model"
version = "0.1.0"
description = "SAIL personalization model components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
